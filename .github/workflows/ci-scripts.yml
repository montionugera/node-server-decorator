name: CI - Scripts

on:
  pull_request:
    paths: ['scripts/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release-notes.test.sh reads real tags and history
      - name: Run every scripts/tests/*.test.sh
        run: |
          fail=0
          for t in scripts/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error::$t failed"; fail=1; }
            echo "::endgroup::"
          done
          exit "$fail"
