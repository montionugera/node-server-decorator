name: CI - Node

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['node/**', 'contracts/**', '.github/workflows/ci-node.yml']
  push:
    branches: [main]
    paths: ['node/**', 'contracts/**', 'go/**', 'go.mod', 'nim/**', 'rust/**', '.github/workflows/ci-node.yml']
  # Manual retrigger for the publish lane (e.g. after fixing registry-side
  # trusted-publisher config) — publishes whatever main currently holds.
  workflow_dispatch:
    inputs:
      force:
        description: 'Bump and publish even when nothing but release bookkeeping changed since the last tag'
        type: boolean
        default: false

# Runs on main are never cancelled: a newer merge could otherwise cancel a run after
# publish but before the release job. Queued runs on main wait their turn; PR runs
# still cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Build before unit tests: gen-zod's specs import @montionugera/entity-spec's dist/.
      - run: pnpm -r run build
      - run: pnpm -r test:unit

  e2e:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test:e2e

  publish:
    name: Bump & Publish (Node + Python)
    needs: [test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      action: ${{ steps.decide.outputs.action }}
    # PyPI trusted publisher for server-decorator-gen-pydantic is registered against
    # this GitHub environment; the other publishers accept any environment.
    environment: pypi
    permissions:
      contents: write
      packages: write
      id-token: write   # required for PyPI and crates.io trusted publishing
    env:
      # `secrets` is not readable in a step `if:`, so expose only whether the token is set.
      HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Decide release or repair
        id: decide
        env:
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          out=$(bash scripts/release-decide.sh)
          echo "$out" | tee -a "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.decide.outputs.action == 'none'
        run: echo "::notice::Only release bookkeeping changed since the last release tag (or nothing did); not bumping or publishing."

      - uses: pnpm/action-setup@v6
        if: steps.decide.outputs.action != 'none'
        with: { version: 9.14.2 }

      - uses: actions/setup-node@v6
        if: steps.decide.outputs.action != 'none'
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml
          registry-url: 'https://npm.pkg.github.com'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
        if: steps.decide.outputs.action != 'none'

      - name: Install Node dependencies
        if: steps.decide.outputs.action != 'none'
        working-directory: node
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        if: steps.decide.outputs.action != 'none'
        working-directory: python
        run: uv sync --all-packages --all-extras

      - name: Bump patch version (Node + Python in lock-step)
        if: steps.decide.outputs.action == 'release'
        run: bash scripts/bump-version.sh patch

      - name: Update Node lockfile
        if: steps.decide.outputs.action == 'release'
        working-directory: node
        run: pnpm install

      - name: Write CHANGELOG entry
        if: steps.decide.outputs.action == 'release'
        run: |
          v=$(node -p "require('./node/packages/core/package.json').version")
          notes=$(bash scripts/release-notes.sh "$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)") || notes=""
          if [ -z "$notes" ]; then
            echo "::warning::release notes could not be derived; writing a placeholder entry"
            notes="- Release $v"
          fi
          [ -f CHANGELOG.md ] || echo '# Changelog' > CHANGELOG.md
          { head -n 1 CHANGELOG.md; printf '\n## %s - %s\n\n%s\n' "$v" "$(date -u +%F)" "$notes"; tail -n +2 CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit version bump
        if: steps.decide.outputs.action == 'release'
        run: |
          git add node/packages/*/package.json node/pnpm-lock.yaml python/packages/*/pyproject.toml python/packages/*/src/*/_version.py python/uv.lock go/entity/version.go go/adapter/gin/go.mod nim/server_decorator.nimble rust/Cargo.toml rust/Cargo.lock CHANGELOG.md
          git commit -m "chore: bump patch version [skip ci]"
          # main can move while this job runs (e.g. a follow-up commit pushed right
          # after a release merge), which rejects a plain push as non-fast-forward.
          # Rebase the bump onto the latest main and retry; a real conflict still fails.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Build Node package
        if: steps.decide.outputs.action != 'none'
        working-directory: node
        run: pnpm run build

      - name: Publish Node to npm
        if: steps.decide.outputs.action != 'none'
        working-directory: node
        run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also publish the public copies to npmjs.com via trusted publishing
      # (OIDC): npmjs trusts this workflow directly, so there is no token to
      # store or expire. Each package needs a trusted publisher configured on
      # npmjs.com (repo montionugera/node-server-decorator, workflow
      # ci-node.yml, environment blank or `pypi` to match this job,
      # "npm publish" allowed). Needs Node >= 22.14 and npm >= 11.5.1, hence
      # the second setup-node.
      - name: Use Node 22 for npmjs.com trusted publishing
        uses: actions/setup-node@v6
        if: steps.decide.outputs.action != 'none'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish Node to npmjs.com
        if: steps.decide.outputs.action != 'none'
        # Optional public mirror: a failure here must not block the PyPI
        # publish or the release tag below.
        continue-on-error: true
        working-directory: node
        run: |
          npm install -g 'npm@^11.5.1'
          # Point each publishable package's publishConfig at npmjs for this
          # step only (working-tree edit, reverted below; GH Packages publish
          # above already ran against the original config).
          for pkg in packages/*/package.json; do
            node -e "const f='$pkg',p=require('./'+f); if(!p.private){p.publishConfig={registry:'https://registry.npmjs.org'};require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')}"
          done
          # A scope mapping beats publishConfig.registry, so pin the scope to
          # npmjs too.
          echo '@montionugera:registry=https://registry.npmjs.org' >> .npmrc
          # pnpm packs (it rewrites workspace: deps to real versions; dist/ is
          # already built by the GH Packages publish above), npm uploads: the
          # OIDC exchange lives in the npm CLI.
          mkdir -p "$RUNNER_TEMP/npmjs"
          for pkg in packages/*/package.json; do
            if node -e "process.exit(require('./$pkg').private ? 1 : 0)"; then
              (cd "$(dirname "$pkg")" && pnpm pack --pack-destination "$RUNNER_TEMP/npmjs")
            fi
          done
          # Try every package even if one is rejected, and always restore
          # the tree before reporting the result.
          rc=0
          for tgz in "$RUNNER_TEMP"/npmjs/*.tgz; do
            spec=$(tar -xOzf "$tgz" package/package.json | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); p.name+'@'+p.version") || { rc=1; continue; }
            if [ "$(npm view "$spec" version 2>/dev/null)" = "${spec##*@}" ]; then
              echo "::notice::$spec is already on npmjs.com; skipping"
              continue
            fi
            npm publish "$tgz" --access public || rc=1
          done
          git checkout -- .
          exit "$rc"

      - name: Build Python packages (core, entity, gen_pydantic, gen_openapi)
        if: steps.decide.outputs.action != 'none'
        working-directory: python
        run: uv build --all-packages

      - name: Publish Python to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.decide.outputs.action != 'none'
        with:
          packages-dir: python/dist
          skip-existing: ${{ steps.decide.outputs.action == 'repair' }}

      # crates.io: a stored CARGO_REGISTRY_TOKEN wins when set (required for the very first
      # publish, because a trusted publisher can only be attached to a crate that already
      # exists); otherwise exchange this workflow's OIDC identity for a short-lived token
      # (each crate needs a trusted publisher on crates.io: repo
      # montionugera/node-server-decorator, workflow ci-node.yml, environment `pypi`).
      - name: Authenticate to crates.io (trusted publishing)
        id: crates-auth
        if: steps.decide.outputs.action != 'none' && env.HAS_CARGO_REGISTRY_TOKEN != 'true'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish Rust crates to crates.io
        if: steps.decide.outputs.action != 'none'
        # Same policy as the npmjs.com step: a failure here must not block the
        # release tag below.
        continue-on-error: true
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: |
          # Every run of this job bumps the version first, so these versions are always new.
          # Dependency order: entity before dto/openapi, dto before axum.
          for crate in server-decorator-entity server-decorator-core server-decorator-dto server-decorator-openapi server-decorator-axum; do
            # Stop at the first failure: later crates depend on earlier ones.
            cargo publish -p "$crate"
          done

      # Go resolves module versions only from vX.Y.Z tags (I-006); this also gives Node and
      # Python releases the single tag ADR 0002 assumes. Last step, so a tag marks only a
      # fully published version; skipped when the tag already exists (idempotent re-runs).
      # The nested Go modules go/adapter/gin and go/adapter/pgxlock resolve only from their own
      # path-prefixed tags, cut in lock-step on the same commit. One atomic push for all missing
      # tags, so origin never ends up with vX.Y.Z but without the adapter tags gin needs.
      - name: Tag release
        id: tag
        if: steps.decide.outputs.action != 'none'
        run: |
          tag="v$(node -p "require('./node/packages/core/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          missing=()
          for t in "$tag" "go/adapter/gin/$tag" "go/adapter/pgxlock/$tag"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then
              echo "Tag $t already exists on origin; skipping."
            else
              git tag "$t"
              missing+=("$t")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            git push --atomic origin "${missing[@]}"
          fi

  # Go and Nim have no registry push: "published" means the tag installs (F-007). Separate
  # job so a failure can be re-run alone — re-running `publish` would fail at the bump push.
  # Fail-closed, but npm, PyPI and the tag are already out: red means investigate, not rollback.
  smoke:
    name: Smoke-install Go + Nim at tag
    needs: [publish]
    if: needs.publish.outputs.action != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}  # avoids GitHub API rate-limit flakes when resolving the toolchain

      # Covers the root module and the nested adapter modules (go/adapter/gin, go/adapter/pgxlock),
      # twice: straight from the git tag, then anonymously through proxy.golang.org and
      # sum.golang.org (retried while the proxy catches up; the script drops this rewrite for it).
      # The repo is public; the token rewrite only authenticates the git-tag pass and the Nim
      # install, sparing them anonymous rate limits. It lives in step env (not
      # `git config --global`), so the token never lands in ~/.gitconfig and never touches the
      # checkout step.
      - name: Go modules install at tag
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/montionugera/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/montionugera/
        run: bash scripts/smoke-install-go.sh "${{ needs.publish.outputs.tag }}"

      - name: Nim package installs at tag
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/montionugera/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/montionugera/
        run: bash scripts/smoke-install-nim.sh "${{ needs.publish.outputs.tag }}"

  # Separate job on purpose: the docs build runs third-party build tooling, which must not run in a
  # job that can mint registry identity tokens, and this job can be re-run alone without publishing.
  release:
    name: GitHub Release + docs archive
    needs: [publish]
    if: needs.publish.outputs.action != 'none'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env: { TAG: '${{ needs.publish.outputs.tag }}' }
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.publish.outputs.tag }}' }
      - uses: pnpm/action-setup@v6
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - name: Build docs archive
        id: docs
        continue-on-error: true
        run: |
          (cd website && pnpm install --frozen-lockfile && pnpm build)
          # The developer portal cross-checks this against the release tag; TAG is the publish job's tag output.
          printf '{"version":"%s"}' "${TAG#v}" > website/dist/version.json
          tar -czf docs-site.tgz -C website/dist .
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.docs.outputs.built == 'true' && 'docs-site.tgz' || '' }}
        run: |
          v="${TAG#v}"
          awk -v h="## $v - " 'index($0,h)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || echo "- Release $v" > notes.md
          [ -n "$ASSET" ] || echo "::warning::docs archive was not built; releasing without docs-site.tgz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$ASSET" ]; then gh release upload "$TAG" "$ASSET" --clobber; fi
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md ${ASSET:+"$ASSET"}
          fi
      - name: Signal the developer portal
        if: steps.docs.outputs.built == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PORTAL_DISPATCH_TOKEN is not set; the developer portal was not signalled"
            exit 0
          fi
          gh workflow run ci.yml -R montionugera/joy-design --ref main
