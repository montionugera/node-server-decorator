name: CI - Node

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['node/**', 'contracts/**', '.github/workflows/ci-node.yml']
  push:
    branches: [main]
    paths: ['node/**', 'contracts/**', 'go/**', 'go.mod', 'nim/**', '.github/workflows/ci-node.yml']
  # Manual retrigger for the publish lane (e.g. after fixing registry-side
  # trusted-publisher config) — publishes whatever main currently holds.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Build before unit tests: gen-zod's specs import @montionugera/entity-spec's dist/.
      - run: pnpm -r run build
      - run: pnpm -r test:unit

  e2e:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test:e2e

  publish:
    name: Bump & Publish (Node + Python)
    needs: [test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # PyPI trusted publisher for server-decorator-gen-pydantic is registered against
    # this GitHub environment; the other publishers accept any environment.
    environment: pypi
    permissions:
      contents: write
      packages: write
      id-token: write   # required for PyPI trusted publisher
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with: { version: 9.14.2 }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml
          registry-url: 'https://npm.pkg.github.com'

      - uses: astral-sh/setup-uv@v3

      - name: Install Node dependencies
        working-directory: node
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-packages --all-extras

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version (Node + Python in lock-step)
        run: bash scripts/bump-version.sh patch

      - name: Update Node lockfile
        working-directory: node
        run: pnpm install

      - name: Commit version bump
        run: |
          git add node/packages/*/package.json node/pnpm-lock.yaml python/packages/*/pyproject.toml python/packages/*/src/*/_version.py python/uv.lock go/entity/version.go nim/server_decorator.nimble
          git commit -m "chore: bump patch version [skip ci]"
          git push

      - name: Build Node package
        working-directory: node
        run: pnpm run build

      - name: Publish Node to npm
        working-directory: node
        run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also publish the public copies to npmjs.com. No-op until the NPM_TOKEN
      # secret (npmjs granular access token, publish scope for @montionugera/*)
      # exists — safe to merge before the token is provisioned.
      - name: Publish Node to npmjs.com
        # Optional public mirror: a failure here must not block the PyPI
        # publish or the release tag below.
        continue-on-error: true
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npmjs.com publish"
            exit 0
          fi
          # Point each publishable package's publishConfig at npmjs for this
          # step only (working-tree edit, reverted below; GH Packages publish
          # above already ran against the original config).
          for pkg in packages/*/package.json; do
            node -e "const f='$pkg',p=require('./'+f); if(!p.private){p.publishConfig={registry:'https://registry.npmjs.org'};require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')}"
          done
          # setup-node maps the @montionugera scope to GitHub Packages in the
          # user-level npmrc, and a scope mapping beats publishConfig.registry;
          # override it here or the publish PUTs to GH Packages with the npmjs
          # token (401).
          echo '@montionugera:registry=https://registry.npmjs.org' >> .npmrc
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc
          pnpm -r publish --no-git-checks --access public
          git checkout -- .

      - name: Build Python packages (core, entity, gen_pydantic, gen_openapi)
        working-directory: python
        run: uv build --all-packages

      - name: Publish Python to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

      # Go resolves module versions only from vX.Y.Z tags (I-006); this also gives Node and
      # Python releases the single tag ADR 0002 assumes. Last step, so a tag marks only a
      # fully published version; skipped when the tag already exists (idempotent re-runs).
      - name: Tag release
        id: tag
        run: |
          tag="v$(node -p "require('./node/packages/core/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists on origin; skipping."
          else
            git tag "$tag"
            git push origin "$tag"
          fi

  # Go and Nim have no registry push: "published" means the tag installs (F-007). Separate
  # job so a failure can be re-run alone — re-running `publish` would fail at the bump push.
  # Fail-closed, but npm, PyPI and the tag are already out: red means investigate, not rollback.
  smoke:
    name: Smoke-install Go + Nim at tag
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}  # avoids GitHub API rate-limit flakes when resolving the toolchain

      # The repo is private and scratch-dir fetches carry no checkout auth header. The rewrite
      # lives in step env (not `git config --global`), so the token never lands in ~/.gitconfig
      # and never touches the checkout step.
      - name: Go module installs at tag
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/montionugera/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/montionugera/
        run: bash scripts/smoke-install-go.sh "${{ needs.publish.outputs.tag }}"

      - name: Nim package installs at tag
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/montionugera/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/montionugera/
        run: bash scripts/smoke-install-nim.sh "${{ needs.publish.outputs.tag }}"
