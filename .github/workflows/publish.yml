name: Build, Test, and Publish

on:
  push:
    branches: [ main ]
    paths: [ 'node/**', '.github/workflows/publish.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'node/**', '.github/workflows/publish.yml' ]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node

    outputs:
      version-changed: ${{ steps.version-check.outputs.version-changed }}
      current-version: ${{ steps.version-check.outputs.current-version }}
      published-version: ${{ steps.version-check.outputs.published-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.14.2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: node/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm test:unit

    - name: Build
      run: pnpm run build

    - name: Check if version changed
      id: version-check
      run: |
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        PUBLISHED_VERSION=$(pnpm view server-decorator version 2>/dev/null || echo "0.0.0")
        echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "published-version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
        if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
          echo "version-changed=true" >> $GITHUB_OUTPUT
          echo "🚀 Version changed: $PUBLISHED_VERSION → $CURRENT_VERSION"
        else
          echo "version-changed=false" >> $GITHUB_OUTPUT
          echo "📦 Version unchanged: $CURRENT_VERSION"
        fi

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-and-test.outputs.version-changed == 'true'
    defaults:
      run:
        working-directory: node

    outputs:
      version: ${{ needs.build-and-test.outputs.current-version }}
      published: ${{ steps.publish-step.outputs.published }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.14.2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: node/pnpm-lock.yaml
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm run build

    - name: Publish to NPM
      id: publish-step
      run: |
        echo "🚀 Publishing to NPM..."
        pnpm publish --no-git-checks
        echo "published=true" >> $GITHUB_OUTPUT
        echo "✅ Published successfully"
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create Git Tag
      run: |
        VERSION=${{ needs.build-and-test.outputs.current-version }}
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag "v$VERSION"
        git push origin "v$VERSION"

    - name: Create GitHub Release
      run: |
        VERSION=${{ needs.build-and-test.outputs.current-version }}
        gh release create "v$VERSION" \
          --title "Release v$VERSION" \
          --notes "🚀 **server-decorator v$VERSION** has been published!

        ## 📦 Installation
        \`\`\`bash
        # pnpm (recommended)
        pnpm add server-decorator@$VERSION

        # npm
        npm install server-decorator@$VERSION

        # yarn
        yarn add server-decorator@$VERSION
        \`\`\`

        ## 🔗 Links
        - 📚 [NPM Package](https://www.npmjs.com/package/server-decorator/v/$VERSION)
        - 📖 [Documentation](https://github.com/${{ github.repository }}#readme)
        - 🐛 [Issues](https://github.com/${{ github.repository }}/issues)

        ## 🎯 Features
        - TypeScript decorators for server-side development
        - Multi-queue support (Redis, RabbitMQ, Kafka)
        - Performance tracking and caching
        - Event emission and workflow orchestration

        ---
        *Auto-generated by GitHub Actions*"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-slack:
    needs: [build-and-test, publish]
    runs-on: ubuntu-latest
    if: always() && needs.publish.result == 'success'

    steps:
    - name: Notify Slack on Success
      run: |
        curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "🚀 New Release Published!",
            "attachments": [
              {
                "color": "good",
                "fields": [
                  {
                    "title": "Package",
                    "value": "📦 server-decorator",
                    "short": true
                  },
                  {
                    "title": "Version", 
                    "value": "🏷️ v${{ needs.build-and-test.outputs.current-version }}",
                    "short": true
                  },
                  {
                    "title": "Repository",
                    "value": "<https://github.com/${{ github.repository }}|${{ github.repository }}>",
                    "short": true
                  },
                  {
                    "title": "NPM Package", 
                    "value": "<https://www.npmjs.com/package/server-decorator|View on NPM>",
                    "short": true
                  },
                  {
                    "title": "Installation",
                    "value": "`pnpm add server-decorator@${{ needs.build-and-test.outputs.current-version }}`",
                    "short": false
                  },
                  {
                    "title": "Release Notes",
                    "value": "<https://github.com/${{ github.repository }}/releases/tag/v${{ needs.build-and-test.outputs.current-version }}|View Release Notes>",
                    "short": false
                  }
                ],
                "footer": "GitHub Actions"
              }
            ]
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-slack-failure:
    needs: [build-and-test, publish]
    runs-on: ubuntu-latest
    if: always() && (needs.build-and-test.result == 'failure' || needs.publish.result == 'failure')

    steps:
    - name: Notify Slack on Failure
      run: |
        curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "❌ Release Failed!",
            "attachments": [
              {
                "color": "danger", 
                "fields": [
                  {
                    "title": "Package",
                    "value": "📦 server-decorator",
                    "short": true
                  },
                  {
                    "title": "Version",
                    "value": "🏷️ v${{ needs.build-and-test.outputs.current-version }}",
                    "short": true
                  },
                  {
                    "title": "Failed Step",
                    "value": "${{ needs.build-and-test.result == 'failure' && 'Build/Test' || 'Publish' }}",
                    "short": true
                  },
                  {
                    "title": "Repository",
                    "value": "<https://github.com/${{ github.repository }}|${{ github.repository }}>",
                    "short": true
                  },
                  {
                    "title": "Workflow Run",
                    "value": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>",
                    "short": false
                  }
                ],
                "footer": "GitHub Actions"
              }
            ]
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }} 