name: 🚀 Publish Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: 🎯 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 🗄️ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm test

      - name: 🔨 Build package
        run: pnpm run build

      - name: ✅ Verify dist files
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Build failed - index.js not found"
            exit 1
          fi
          if [ ! -f "dist/index.d.ts" ]; then
            echo "❌ Build failed - index.d.ts not found"
            exit 1
          fi
          echo "✅ Build verification passed"

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: 🎯 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 🗄️ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build package
        run: pnpm run build

      - name: 🔍 Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Check if this version exists on NPM
          if pnpm view server-decorator@$CURRENT_VERSION version 2>/dev/null; then
            echo "version-exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version $CURRENT_VERSION already exists on NPM"
          else
            echo "version-exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $CURRENT_VERSION is new, ready to publish"
          fi

      - name: 🚀 Publish to NPM
        if: steps.version-check.outputs.version-exists == 'false'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📢 Create Release
        if: steps.version-check.outputs.version-exists == 'false'
        run: |
          git tag v${{ steps.version-check.outputs.current-version }}
          git push origin v${{ steps.version-check.outputs.current-version }}
          
          gh release create v${{ steps.version-check.outputs.current-version }} \
            --title "Release v${{ steps.version-check.outputs.current-version }}" \
            --notes "🎉 **New Release: v${{ steps.version-check.outputs.current-version }}**

          📦 Published to NPM: \`npm install server-decorator@${{ steps.version-check.outputs.current-version }}\`
          📦 Or with pnpm: \`pnpm add server-decorator@${{ steps.version-check.outputs.current-version }}\`

          ## Changes
          - Auto-generated from commit: ${{ github.sha }}

          ## Installation
          \`\`\`bash
          # npm
          npm install server-decorator@latest
          
          # pnpm (recommended)
          pnpm add server-decorator@latest
          
          # yarn
          yarn add server-decorator@latest
          \`\`\`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⏭️ Skip publish
        if: steps.version-check.outputs.version-exists == 'true'
        run: echo "📋 Skipping publish - version already exists on NPM" 