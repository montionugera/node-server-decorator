name: CI - Contracts

on:
  # I-e (P1 gate-review): widened from `node/packages/{core/src,entity}/**` +
  # `python/packages/{core/src,entity}/**` to the whole `node/packages/**`/`python/packages/**`
  # trees, and `scripts/**` was added — a change to `scripts/check-versions.sh`,
  # `scripts/bump-version.sh`, or a gen-zod/gen_pydantic package manifest previously triggered
  # NO workflow at all (including the very check-versions.sh lockstep gate those scripts back).
  # Both jobs in this workflow share one trigger (GitHub Actions has no native per-job path
  # filter), so `entity-parity` now also runs on this broader set — acceptable since it's a
  # cheap job and a broad trigger here is safe.
  pull_request:
    paths:
      - 'contracts/**'
      - 'node/packages/**'
      - 'python/packages/**'
      - 'scripts/**'
      - 'go/**'
      - 'go.mod'
      - 'go.sum'
      - 'nim/**'
      - 'rust/**'
      - '.github/workflows/ci-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'node/packages/**'
      - 'python/packages/**'
      - 'scripts/**'
      - 'go/**'
      - 'go.mod'
      - 'go.sum'
      - 'nim/**'
      - 'rust/**'
      - '.github/workflows/ci-contracts.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - run: npm i -g ajv-cli@5
      - name: Validate fixtures against schemas
        run: bash contracts/scripts/validate.sh
      - name: Assert contract version match (Node ↔ Python ↔ contracts/VERSION)
        run: |
          contract=$(cat contracts/VERSION | tr -d '[:space:]')
          py_v=$(grep -oP 'CONTRACT_VERSION\s*=\s*"\K[^"]+' python/packages/core/src/server_decorator/_contract.py)
          node_v=$(grep -oE "CONTRACT_VERSION\s*=\s*'[^']+'" node/packages/core/src/_contract.ts | grep -oE "'[^']+'" | tr -d "'")
          if [ "$contract" != "$py_v" ]; then
            echo "FAIL: contracts/VERSION ($contract) != python ($py_v)" >&2
            exit 1
          fi
          if [ "$contract" != "$node_v" ]; then
            echo "FAIL: contracts/VERSION ($contract) != node ($node_v)" >&2
            exit 1
          fi
          echo "OK: contract=$contract node=$node_v python=$py_v"
      - name: Assert package version match (Node ↔ Python)
        run: bash scripts/check-versions.sh
  entity-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v6
        with: { node-version: '20', cache: 'pnpm', cache-dependency-path: node/pnpm-lock.yaml }
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      # check-entity-parity.sh runs the Go producer too (I-006).
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      # check-entity-parity.sh and check-openapi-parity.sh run the Nim producers too (F-006).
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}  # avoids GitHub API rate-limit flakes when resolving the toolchain
      - run: cd node && pnpm install --frozen-lockfile
      - run: cd python && uv sync --all-packages
      - run: bash scripts/check-entity-parity.sh
      - run: bash scripts/check-openapi-parity.sh
