name: 🔢 Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 🔢 Bump version
        run: npm version ${{ github.event.inputs.version_type }} --no-git-tag-version

      - name: 📝 Get new version
        id: version
        run: echo "new-version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 💾 Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${{ steps.version.outputs.new-version }}"
          git push

      - name: 🏷️ Create tag
        run: |
          git tag v${{ steps.version.outputs.new-version }}
          git push origin v${{ steps.version.outputs.new-version }} 