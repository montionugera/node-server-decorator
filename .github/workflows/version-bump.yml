name: 🔢 Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false

      - name: 🎯 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 🗄️ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('node/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm test:unit

      - name: 🔢 Bump version
        run: pnpm version ${{ github.event.inputs.version_type }} --no-git-tag-version

      - name: 📝 Get new version
        id: version
        run: echo "new-version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 💾 Commit changes
        working-directory: ${{ github.workspace }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add node/package.json node/pnpm-lock.yaml
          git commit -m "chore: bump version to v${{ steps.version.outputs.new-version }}"
          git push

      - name: 🏷️ Create tag
        working-directory: ${{ github.workspace }}
        run: |
          git tag v${{ steps.version.outputs.new-version }}
          git push origin v${{ steps.version.outputs.new-version }}
