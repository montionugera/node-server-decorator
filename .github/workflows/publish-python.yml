name: Publish - Python

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # PyPI Trusted Publisher (no token needed)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify tag matches package version
        run: |
          pkg_version=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)
          tag_version="${GITHUB_REF#refs/tags/v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "FAIL: tag v$tag_version does not match python/pyproject.toml version $pkg_version" >&2
            exit 1
          fi

      - name: Test
        run: uv run pytest -q tests/unit

      - name: Build
        run: uv build

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
