[project]
name = "server-decorator"
version = "2.0.13"
description = "Server-side decorators for caching, tracking, and queue emission. Polyglot sibling of the Node `server-decorator` npm package."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "server-decorator contributors"}]
keywords = ["decorators", "caching", "tracking", "queue", "redis", "rabbitmq", "kafka"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
redis    = ["redis>=5.0"]
rabbitmq = ["aio-pika>=9.4"]
kafka    = ["aiokafka>=0.11"]
bullmq   = ["bullmq>=2.0"]
fastapi  = ["fastapi>=0.100.0", "httpx>=0.25.0"]
all      = ["redis>=5.0", "aio-pika>=9.4", "aiokafka>=0.11", "bullmq>=2.0", "fastapi>=0.100.0", "httpx>=0.25.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "tomli>=2.0; python_version < '3.11'",
    "redis>=5.0",
    "aio-pika>=9.4",
    "aiokafka>=0.11",
    "bullmq>=2.0",
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
    "testcontainers[redis,rabbitmq,kafka]>=4.7",
]

[project.urls]
Homepage = "https://github.com/your-username/server-decorator"
Repository = "https://github.com/your-username/server-decorator"
Issues = "https://github.com/your-username/server-decorator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_decorator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]
# RUF022: keep our grouped/commented __all__ ordering (section comments get destroyed
# by the isort-style sort).
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/server_decorator"]

# Optional adapter dependencies don't ship `py.typed`. Treat them as untyped so
# strict-mode still passes; the adapter wrappers keep the public-facing types
# precise on the server-decorator side.
[[tool.mypy.overrides]]
module = ["aiokafka.*", "aio_pika.*", "redis.*", "redis.asyncio", "bullmq.*", "fastapi.*", "httpx.*", "starlette.*"]
# Make the optional adapter deps appear as Any. They don't ship `py.typed`,
# and we don't want to vendor stubs for one thin wrapper layer.
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker / testcontainers",
]
