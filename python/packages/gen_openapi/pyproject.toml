[project]
name = "server-decorator-gen-openapi"
version = "2.0.15"
description = "IR-derived OpenAPI 3.1 document (contracts/rules/rest-conventions.md). Polyglot sibling of @montionugera/entity-spec-gen-openapi."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["server-decorator-entity==2.0.15"]

[tool.uv.sources]
server-decorator-entity = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_decorator_gen_openapi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/server_decorator_gen_openapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
