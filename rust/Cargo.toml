[workspace]
members = [
    "crates/server-decorator-entity",
    "crates/server-decorator-openapi",
    "crates/server-decorator-dto",
    "crates/server-decorator-core",
    "crates/server-decorator-axum",
    "examples/axum-entity-server",
]
resolver = "2"

[workspace.package]
version = "2.0.25"
edition = "2021"
license = "MIT"
authors = ["Montionugera"]
repository = "https://github.com/montionugera/node-server-decorator"
# Relative to this workspace root; cargo copies it into each crate tarball. The MIT text
# ships through each crate's LICENSE symlink to the repo-root LICENSE.
readme = "README.md"

[workspace.dependencies]
# Internal crates: crates.io needs a version next to the path. scripts/bump-version.sh keeps
# these in lock-step with [workspace.package].version; scripts/check-versions.sh asserts it.
server-decorator-entity = { path = "crates/server-decorator-entity", version = "2.0.25" }
server-decorator-dto = { path = "crates/server-decorator-dto", version = "2.0.25" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
regex = "1.10"
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
